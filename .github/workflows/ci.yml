name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v
      - name: Test (race)
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  demo:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build binary and web
        run: |
          go build -o convergedb ./cmd/convergedb
          (cd web && npm ci && npm run build)
      - name: Seeded partition-heal demo (3 real processes)
        run: ./convergedb demo partition-heal --seed 42 --out var/reports/partition-heal-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: var/reports/partition-heal-report.json
